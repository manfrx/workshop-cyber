version: "3.9"

services:
  db:
    image: mysql:8
    restart: unless-stopped
    # O seed fica montado somente-leitura em /seed. Antes de o MySQL subir,
    # copiamos os scripts para o diretório de init do container substituindo
    # o marcador __C1_FLAG__ pelo valor de C1_FLAG (definido em infra/.env).
    # Assim a flag NUNCA é hardcoded no repositório e o seed original
    # permanece intacto no disco.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p /docker-entrypoint-initdb.d
        FLAGVAL="$${C1_FLAG}"
        [ -n "$$FLAGVAL" ] || FLAGVAL='FLAG{PLACEHOLDER_C1}'
        for f in /seed/*; do
          [ -f "$$f" ] || continue
          base=$$(basename "$$f")
          case "$$base" in
            *.sql) sed "s|__C1_FLAG__|$$FLAGVAL|g" "$$f" > "/docker-entrypoint-initdb.d/$$base" ;;
            *)     cp "$$f" "/docker-entrypoint-initdb.d/$$base" ;;
          esac
        done
        exec docker-entrypoint.sh mysqld
    environment:
      MYSQL_ROOT_PASSWORD: ${C1_DB_PASSWORD}
      MYSQL_DATABASE: ${C1_DB_NAME}
      MYSQL_USER: ${C1_DB_USER}
      MYSQL_PASSWORD: ${C1_DB_PASSWORD}
      C1_FLAG: ${C1_FLAG}
    volumes:
      - ./../scenario-1-sqli/seed:/seed:ro
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${C1_DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  medclinic:
    build: ../scenario-1-sqli
    restart: unless-stopped
    ports:
      - "${C1_PORT}:3000"
    environment:
      DB_HOST: db
      DB_PORT: ${C1_DB_PORT}
      DB_NAME: ${C1_DB_NAME}
      DB_USER: ${C1_DB_USER}
      DB_PASSWORD: ${C1_DB_PASSWORD}
      FLAG: ${C1_FLAG}
    depends_on:
      db:
        condition: service_healthy

  meridian:
    build:
      context: ../scenario-2-cmdi
      args:
        # A flag é gravada em /root/flag.txt durante o BUILD (veja o Dockerfile).
        C2_FLAG: ${C2_FLAG}
    restart: unless-stopped
    ports:
      # O container escuta em 3000 (PORT=3000 no server.js). A porta pública
      # do cenário é C2_PORT (3001).
      - "${C2_PORT}:3000"
    environment:
      PORT: 3000

  webmail:
    build: ../phishing/webmail
    restart: unless-stopped
    ports:
      - "${C3_PORT}:3002"
    environment:
      SECRET: ${C3_WEBMAIL_SECRET}

volumes:
  dbdata:
