worker_processes auto;
events { worker_connections 1024; }

http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Porta 80: a isca do Cenário 3 (documento) fica em HTTP puro, a pedido —
  # assim a página HTTP consegue chamar http://127.0.0.1:10000/hack sem bloqueio
  # de "mixed content". O resto é redirecionado para HTTPS.
  server {
    listen 80 default_server;
    server_name _;
    location /stream {
      proxy_pass http://127.0.0.1:13003;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(documento|download|static|api/(state|disparar|reverter))(/|$) {
      proxy_pass http://127.0.0.1:13003;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS termina aqui; proxy para plataforma e Guacamole (rede local da mgmt)
  server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Guacamole (precisa de WebSocket)
    location /guacamole/ {
      proxy_pass http://127.0.0.1:8080/guacamole/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cookie_path /guacamole/ /guacamole/;
      access_log off;
    }

    # Cenário 3 — servidor de controle (isca/painel), porta 3003.
    # /stream é SSE: sem buffering e sem timeout curto.
    location /stream {
      proxy_pass http://127.0.0.1:13003;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(documento|download|static|painel|api/(state|disparar|reverter))(/|$) {
      proxy_pass http://127.0.0.1:13003;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Plataforma do workshop (tudo o mais)
    location / {
      proxy_pass http://127.0.0.1:3005/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ==== Challenges em HTTPS dedicado ====================================
  # TLS termina aqui; os apps ficam só no loopback (127.0.0.1:1300x).
  # c1 (SQLi) -> https://IP:3000 | c2 (CMDi) -> https://IP:3001 | c3 -> https://IP:3003
  server {
    listen 3000 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    location / {
      proxy_pass http://127.0.0.1:13000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
  server {
    listen 3001 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    location / {
      proxy_pass http://127.0.0.1:13001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
  server {
    listen 3003 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    location /stream {
      proxy_pass http://127.0.0.1:13003;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
      proxy_pass http://127.0.0.1:13003;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
